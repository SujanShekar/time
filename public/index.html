<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="description" content="A simple AI chatbot powered by Groq" />
  <title>Groq AI Chatbot</title>
  <link rel="stylesheet" href="style.css" />
</head>
<body>

  <!-- ── Header ──────────────────────────────────────────────────────── -->
  <header class="header" role="banner">
    <div class="header-inner">
      <div class="header-brand">
        <svg class="logo" viewBox="0 0 32 32" fill="none" xmlns="http://www.w3.org/2000/svg" aria-hidden="true">
          <rect width="32" height="32" rx="8" fill="#6366f1"/>
          <path d="M8 11C8 9.34315 9.34315 8 11 8H21C22.6569 8 24 9.34315 24 11V17C24 18.6569 22.6569 20 21 20H18L14 24V20H11C9.34315 20 8 18.6569 8 17V11Z" fill="white"/>
          <circle cx="13" cy="14" r="1.5" fill="#6366f1"/>
          <circle cx="16" cy="14" r="1.5" fill="#6366f1"/>
          <circle cx="19" cy="14" r="1.5" fill="#6366f1"/>
        </svg>
        <h1 class="header-title">Groq AI Chatbot</h1>
      </div>
      <div class="status-badge" aria-live="polite">
        <span class="status-dot" id="status-indicator" aria-hidden="true"></span>
        <span class="status-text" id="status-text">Checking…</span>
      </div>
    </div>
  </header>

  <!-- ── Main ────────────────────────────────────────────────────────── -->
  <main class="main" role="main">
    <div class="chat-container">

      <!-- Messages area -->
      <div class="messages-area" id="messages-area" role="log" aria-label="Chat messages" aria-live="polite">

        <!-- Welcome screen -->
        <div class="welcome-screen" id="welcome-screen">
          <div class="welcome-icon" aria-hidden="true">
            <svg viewBox="0 0 48 48" fill="none" xmlns="http://www.w3.org/2000/svg">
              <rect width="48" height="48" rx="14" fill="#eef2ff"/>
              <path d="M12 17C12 14.7909 13.7909 13 16 13H32C34.2091 13 36 14.7909 36 17V25C36 27.2091 34.2091 29 32 29H27L22 35V29H16C13.7909 29 12 27.2091 12 25V17Z" fill="#6366f1"/>
              <circle cx="20" cy="21" r="2" fill="white"/>
              <circle cx="24" cy="21" r="2" fill="white"/>
              <circle cx="28" cy="21" r="2" fill="white"/>
            </svg>
          </div>
          <h2 class="welcome-title">Hello! I'm your AI assistant</h2>
          <p class="welcome-subtitle">Ask me anything — I can explain concepts, help with code, brainstorm ideas, and more.</p>
          <div class="example-prompts" role="list" aria-label="Example questions">
            <button class="example-btn" role="listitem" data-prompt="What is artificial intelligence?">
              <span class="example-icon" aria-hidden="true">🤖</span>
              What is artificial intelligence?
            </button>
            <button class="example-btn" role="listitem" data-prompt="Explain photosynthesis simply">
              <span class="example-icon" aria-hidden="true">🌿</span>
              Explain photosynthesis simply
            </button>
            <button class="example-btn" role="listitem" data-prompt="What's the difference between HTML and CSS?">
              <span class="example-icon" aria-hidden="true">💻</span>
              What's the difference between HTML and CSS?
            </button>
            <button class="example-btn" role="listitem" data-prompt="Give me 3 ideas for a college project">
              <span class="example-icon" aria-hidden="true">💡</span>
              Give me 3 ideas for a college project
            </button>
          </div>
        </div>

      </div>

      <!-- Loading indicator -->
      <div class="loading-indicator" id="loading-indicator" aria-label="Assistant is thinking" role="status" hidden>
        <div class="loading-bubble">
          <span class="dot"></span>
          <span class="dot"></span>
          <span class="dot"></span>
        </div>
      </div>

      <!-- Input area -->
      <div class="input-area" role="form" aria-label="Send a message">
        <div class="input-row">
          <textarea
            id="message-input"
            class="message-input"
            placeholder="Ask me anything…"
            rows="1"
            aria-label="Message input"
            aria-multiline="true"
            autocomplete="off"
            spellcheck="true"
          ></textarea>
          <button id="send-btn" class="send-btn" aria-label="Send message" disabled>
            <svg viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg" aria-hidden="true">
              <path d="M22 2L11 13" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
              <path d="M22 2L15 22L11 13L2 9L22 2Z" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
            </svg>
          </button>
          <button id="clear-btn" class="clear-btn" aria-label="Clear chat" title="Clear conversation">
            <svg viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg" aria-hidden="true">
              <path d="M3 6H21" stroke="currentColor" stroke-width="2" stroke-linecap="round"/>
              <path d="M8 6V4H16V6" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
              <path d="M19 6L18.0801 19.1201C17.9389 20.7461 16.5814 22 14.95 22H9.05C7.41864 22 6.06109 20.7461 5.91994 19.1201L5 6" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
            </svg>
          </button>
        </div>
        <p class="input-hint">Press <kbd>Enter</kbd> to send · <kbd>Shift+Enter</kbd> for new line</p>
      </div>

    </div>
  </main>

  <!-- ── Footer ──────────────────────────────────────────────────────── -->
  <footer class="footer" role="contentinfo">
    <small>AI can make mistakes — always verify important information.</small>
  </footer>

  <script src="script.js" defer></script>
</body>
</html>
